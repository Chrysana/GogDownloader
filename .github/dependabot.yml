version: 2
updates:
  # PHP libraries (Symfony etc.)
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      symfony:
        patterns:
          - 'symfony/*'
      dev-tools:
        dependency-type: development
    ignore:
      # Symfony major upgrades (e.g. 8.x) are done deliberately, not by a bot
      - dependency-name: 'symfony/*'
        update-types: ['version-update:semver-major']

  # actions used by the build workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  # php base image of the Docker build
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
